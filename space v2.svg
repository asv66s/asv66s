<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
        .container{
           overflow-y:scroll;
          height: 300px;
        }
				body {
  background: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
  margin: 0;
  line-height: 1.75rem;
}

h1 {font-size: 2.25rem;}
h2 {font-size: 1.75rem;}
p {font-size: 1.25rem;}

main {
  background-color: slategray;
  display: flex;
  flex-direction: column;
  color: white;
}

section {
  padding: 2rem;
  height: 50vh;
  min-height: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

section > * {
  max-width: 600px
}

.emoji {
  z-index: 0;
  display: inline-block;
  font-size: 50px;
}

section.hero {
  position: relative;
  background-color: #1a1a1a;
  background-color: #272727;
  background-size: auto 5rem;
  background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffee' fill-opacity='0.3' fill-rule='evenodd'/%3E%3C/svg%3E");
  animation: parallax linear;
  animation-timeline: scroll(); 
}

.hero-content {
  text-align: center;
  position: absolute;
  top: 25%;
  animation: float linear;
  animation-timeline: view(-100px); 
}

.hero-content > * {
  position: relative;
}


#satellite {
  animation: orbit-in linear, orbit-out ease;
  animation-timeline: view();
  animation-range: 0% 80%, 80% 110%;
}

#spaceship {
  animation: launch;
  animation-timeline: view();
  animation-range: 0% 120%;
}

#comet {
  transform: translateX(100px);
  animation: rotate linear;
  transform-origin: center 125px;
  animation-timeline: view();
  animation-range: 4rem 120%;
}

/* Animation keyframes */

@keyframes parallax {
  from {
    background-position: bottom 0px center;
  }
  to {
    background-position: bottom -400px center;
  }
}

@keyframes float {
  from {
    top: 25%;
  }
  to {
    top: 50%;
  }
}

@keyframes orbit-in {
  0% {
    transform: rotate(200deg);
  }

  100% {
    transform: rotate(0deg);
  }
}

@keyframes orbit-out {
  0% {
    transform: translate(0px, 0px);
  }
  100% {
    transform: translate(-50px, -15px);
  }
}

@keyframes launch {
from {
    transform: translate(-100px, 200px);
  }
to {
    transform: translate(100px, -100px);
  }

}

@keyframes rotate {
from {
    transform: rotate(0deg) translateX(100px);
  }
to {
    transform: rotate(-70deg) translateX(0px);
  }

}

/* Remove animations for users who prefer reduced motion */

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
  }
}
			</style>
			<div class="container">
				<main>

  
  <section class="hero">
    <div class="hero-content">
      <span class="emoji" id="satellite">🛰️</span>
      
      <span class="emoji" id="comet">☄️</span>
      <h2>space is cool</h2>
      <span class="emoji" id="spaceship">🚀</span>
      <br/><br/><br/><br/><br/><br/><br/><br/><br/>
    </div>
  </section>
 
     
</main>


			</div>
		</div>
	</foreignObject>
</svg>
